# CI: what a pull request needs answered -- does the driver still build
# and read Btrfs correctly against the pinned siblings.
#
# Four jobs here and the Windows matrix (matrix.yml, called at the end):
#
# - portable: the half outside `mod winfsp_adapter`, on Linux and macOS.
#   Cheap, and catches most dependency drift before the expensive jobs.
# - fixtures: the driver's read paths against a Btrfs image mkfs.btrfs made
#   and the Linux kernel populated -- the independent oracle.
# - windows: `cargo check` of the WinFsp adapter and the service, which
#   exist only on Windows and otherwise compile only at release time.
# - matrix: the driver mounted through WinFsp on a Windows runner.
#
# The windows job reuses release.yml's Rust / LLVM-MinGW / libclang / WinFsp
# setup, because that is what makes the Windows half compile at all, and
# stops there: no WiX, no MSI, no installer. Those are release concerns.
name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base: a stacked one gets a run too.
  pull_request:
  # The merge queue's run: main plus the queued pull requests, the run that
  # decides whether they land. The queue reads ci-ok only from a workflow
  # that triggers here.
  merge_group:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Does this change need the full pipeline? rust-fs-core's
  # scripts/code-changed.sh reads the change's paths and says false only when
  # every one is documentation. The change is the pull request's diff, the
  # merge queue group's (its base_sha to its head_sha: what the queue is about
  # to land), or a push to main's (before to after); a push it cannot diff
  # runs everything. The fixture oracle, the Windows check and the matrix run
  # only when the answer is true, and ci-ok accepts their skip when, and only
  # when, it is false.
  changes:
    name: changes (does this need the full pipeline?)
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: rust-fs-core at the pinned tag, for code-changed.sh
        uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.3.8
          path: rust-fs-core
      - name: Classify the change
        id: c
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          range=
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            merge_group) range="$MQ_BASE...$MQ_HEAD" ;;
            push)
              case "$REF" in
                refs/heads/*)
                  if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ] &&
                    git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                    range="$PUSH_BEFORE...$PUSH_AFTER"
                  fi ;;
              esac ;;
          esac
          if [ -n "$range" ]; then
            git diff --name-only "$range" | tee changed.txt
            code="$(bash rust-fs-core/scripts/code-changed.sh < changed.txt)"
          else
            code=true
          fi
          echo "code=$code ($EVENT${range:+ $range})"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The portable half: everything outside `mod winfsp_adapter`. Cheap,
  # fast, and catches most dependency drift before the expensive job
  # even starts.
  portable:
    name: check (${{ matrix.os }}, no Windows features)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        # No submodules: there are none left. Every dependency,
        # including the winfsp-rs fork, is a sibling checked out by
        # `chore siblings` in the next step.
        #
        # winfsp-rs is needed on THIS runner too, despite being
        # Windows-only. Cargo resolves every path dependency when it
        # parses the manifest, including ones under
        # `[target.'cfg(windows)'.dependencies]` that this target will
        # never build, so without it the run dies before compiling
        # anything:
        #
        #   error: failed to get `winfsp` as a dependency
        #   Caused by: failed to read ../winfsp-rs/winfsp/Cargo.toml
        #
        # "It is Windows-only so Linux does not need it" is the
        # intuition, and it is wrong: cargo needs the manifest to exist,
        # not the code to compile.

      - name: check out sibling repos
        # The family repos are siblings, not submodules; the refs live
        # in chores.yml so this reads them from there rather than
        # restating them. chore itself is fetched at a pinned version —
        # an unpinned installer would make this workflow depend on
        # whatever chore shipped that morning, which is the opposite of
        # what pinning the siblings is for.
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)   asset="chore-0.9.0-linux-x86_64.tar.gz" ;;
            Linux-aarch64)  asset="chore-0.9.0-linux-arm64.tar.gz" ;;
            Darwin-arm64)   asset="chore-0.9.0-darwin-arm64.tar.gz" ;;
            Darwin-x86_64)  asset="chore-0.9.0-darwin-x86_64.tar.gz" ;;
            *) echo "no chore build for $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/antimatter-studios/chore/releases/download/v0.9.0/$asset" \
            | sudo tar xz -C /usr/local/bin chore
          chore siblings

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - run: cargo check --locked --no-default-features
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      # Everything that needs no fixture. tests/mount_reads.rs requires the
      # `fixtures` feature, so it is not built here rather than skipped:
      # the fixtures job runs it.
      - run: cargo test --locked --no-default-features

  # A real Btrfs filesystem, made by mkfs.btrfs and populated by the kernel.
  #
  # The independent oracle: an image this repository built itself would
  # share the driver's reading of the format, and the two would agree with
  # each other while disagreeing with every real volume.
  #
  # It has to be Linux: mkfs.btrfs is Linux-only, and populating the image
  # means loop-mounting it, which needs root.
  fixtures:
    name: test against a real Btrfs filesystem
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check out sibling repos
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)   asset="chore-0.9.0-linux-x86_64.tar.gz" ;;
            Linux-aarch64)  asset="chore-0.9.0-linux-arm64.tar.gz" ;;
            *) echo "unexpected runner $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/antimatter-studios/chore/releases/download/v0.9.0/$asset" \
            | sudo tar xz -C /usr/local/bin chore
          chore siblings

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # btrfs-progs provides mkfs.btrfs and btrfs. Print the versions:
      # which features mkfs turns on by default depends on them, so a
      # failure that only happens here is worth being able to date.
      - name: Install btrfs-progs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs
          mkfs.btrfs --version
          uname -r

      - name: Build the fixture
        run: sudo scripts/build-fixtures.sh .fixtures

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fixtures-cargo-${{ hashFiles('**/Cargo.lock') }}

      # BTRFS_TEST_IMAGE is explicit rather than relying on the .fixtures
      # fallback, so a path change breaks loudly here.
      - name: Run every test against it
        env:
          BTRFS_TEST_IMAGE: ${{ github.workspace }}/.fixtures/btrfs-content.img
        run: |
          set -euo pipefail
          mkdir -p tmp/logs
          cargo test --locked --no-default-features --features fixtures 2>&1 | tee tmp/logs/fixtures-all.log
          cargo test --locked --no-default-features --features fixtures --test mount_reads 2>&1 | tee tmp/logs/fixtures.log
          cargo test --locked --no-default-features --features fixtures --test write_in_place 2>&1 | tee tmp/logs/fixtures-write.log

      # A run that stops early reports no failures, so only a count tells it
      # from a pass: every fixture test executed and passed.
      - name: every fixture test executed
        run: |
          set -euo pipefail
          bash scripts/matrix-floor.sh tmp/logs/fixtures.log 15
          bash scripts/matrix-floor.sh tmp/logs/fixtures-write.log 6

      # The write tests above read back through the driver, so they prove
      # only that it agrees with itself. These judges are independent of
      # it: btrfs check on the image after the driver's writes, and the
      # kernel mounting it and reading the file back.
      - name: btrfs check and the kernel judge the driver's writes
        run: |
          set -euo pipefail
          cargo build --locked --no-default-features --bin btrfs
          sudo scripts/oracle-write.sh target/debug/btrfs .fixtures/btrfs-content.img

  # The half that only exists on Windows, and the reason this file is
  # worth its runtime.
  windows:
    name: check (windows, mount + service)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    env:
      LLVM_MINGW_VER: 20260421
    steps:
      - uses: actions/checkout@v4
        # No submodules; winfsp-rs is a sibling like everything else,
        # and the header patch below reaches into that checkout.

      - name: check out sibling repos
        # chore publishes darwin and linux builds only, and `uname -s`
        # under Git Bash reports MINGW64_NT-*, so there is nothing to
        # install here. Cloning directly restates what `chore siblings`
        # does — which is the duplication chores.yml exists to remove —
        # so it reads the refs OUT OF chores.yml rather than hardcoding
        # them, and the single declaration still holds.
        shell: bash
        run: |
          set -euo pipefail
          pin() { sed -n "s/^  $1: *//p" chores.yml | tr -d '\r'; }
          # URL as well as ref. The family is not all in one org, so
          # reconstructing a URL from the repo name silently points at a
          # repo that does not exist -- and git then prompts for
          # credentials, so the run dies with "could not read Username",
          # which reads as an auth problem rather than a wrong URL.
          printf '%s\t%s\t%s\n' \
            rust-fs-core       "$(pin FS_CORE_URL)" "$(pin FS_CORE_REF)" \
            rust-fs-btrfs      "$(pin FS_BTRFS_URL)" "$(pin FS_BTRFS_REF)" \
            winfsp-fs-skeleton "$(pin SKELETON_URL)" "$(pin SKELETON_REF)" \
            fs-windows-test-harness "$(pin HARNESS_URL)" "$(pin HARNESS_REF)" \
            winfsp-rs          "$(pin WINFSP_RS_URL)" "$(pin WINFSP_RS_REF)" \
          | while IFS="$(printf '\t')" read -r name url ref; do
              echo "cloning $name at $ref"
              # init + fetch-by-ref, not clone. winfsp-rs is pinned to a
              # bare commit that no published branch contains, so a
              # plain clone does not have it and `--branch` cannot name
              # it. Asking the server for the SHA directly does work.
              git init --quiet "../$name"
              git -C "../$name" remote add origin "$url"
              git -C "../$name" fetch --quiet --depth 1 origin "$ref"
              git -C "../$name" checkout --quiet FETCH_HEAD
            done

      - name: install Rust + gnullvm target
        shell: pwsh
        run: |
          rustup install stable
          rustup default stable
          rustup target add x86_64-pc-windows-gnullvm
          rustc --version

      - name: install LLVM-MinGW (gnullvm toolchain)
        shell: pwsh
        run: |
          # Provides the gnullvm runtime + sysroot. Its standalone
          # release zip does NOT ship libclang.dll, so libclang for
          # bindgen comes from the separate step below.
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/${{ env.LLVM_MINGW_VER }}/llvm-mingw-${{ env.LLVM_MINGW_VER }}-ucrt-x86_64.zip"
          $zip = "$env:RUNNER_TEMP\llvm-mingw.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\llvm-mingw" -Force
          $extracted = Get-ChildItem "$env:RUNNER_TEMP\llvm-mingw" -Directory | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $extracted.FullName 'bin')

      - name: install LLVM (libclang for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          # Pinned to 18.1 for the same reason release.yml pins it: old
          # enough to parse LLVM-MinGW's clang-22 sysroot headers
          # without the AVX-512 self-compile errors a same-version
          # libclang trips on.
          version: '18.1'
          directory: ${{ runner.temp }}/llvm

      - name: install WinFsp (build-time headers + libs)
        shell: pwsh
        run: |
          # Retries a feed error and fails unless the headers are there (#4).
          ./scripts/install-winfsp.ps1

      - name: patch fsctl.h for the _ReadWriteBarrier collision
        shell: pwsh
        run: |
          # clang's MSVC compatibility predefines _ReadWriteBarrier as a
          # 0-arg function-like macro via intrin.h. WinFsp's fsctl.h then
          # forward-declares `void _ReadWriteBarrier(void);`, which the
          # preprocessor mangles into `void ;`. `-U_ReadWriteBarrier`
          # does not help, because intrin.h is included after it.
          #
          # Wrap the forward-decl in push_macro / undef / pop_macro so
          # the macro is hidden at exactly the point the function has to
          # be declared. Both the vendored header and the choco-installed
          # one are patched, since which is read depends on winfsp-sys's
          # `system` feature. Kept identical to release.yml: if these two
          # ever disagree, CI stops predicting the release.
          $needle = '    void _ReadWriteBarrier(void);'
          $replacement = "#pragma push_macro(`"_ReadWriteBarrier`")`n#undef _ReadWriteBarrier`n    void _ReadWriteBarrier(void);`n#pragma pop_macro(`"_ReadWriteBarrier`")"
          foreach ($f in @(
            '../winfsp-rs/winfsp-sys/winfsp/inc/winfsp/fsctl.h',
            'C:\Program Files (x86)\WinFsp\inc\winfsp\fsctl.h'
          )) {
            if (-not (Test-Path $f)) { "Skipping (not found): $f"; continue }
            $content = Get-Content $f -Raw
            Set-Content -Path $f -Value ($content -replace [regex]::Escape($needle), $replacement) -NoNewline
            "Patched $f"
          }

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check --features mount,service
        shell: pwsh
        run: cargo check --locked --features mount,service --target x86_64-pc-windows-gnullvm

  # THE MATRIX lives in matrix.yml, so the release can run the same matrix
  # against the driver its installer installs. Here it runs against a
  # development build of this commit.
  matrix:
    name: matrix
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/matrix.yml
  # THE ONE REQUIRED CHECK. Branch protection names this job instead of each
  # job above, so a job can be added, renamed or split without leaving a
  # required check that never reports. It accepts a skipped job only when
  # the change was documentation alone.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, portable, fixtures, windows, matrix]
    runs-on: ubuntu-latest
    steps:
      - name: every gating job must have concluded success
        env:
          NEEDS: ${{ toJSON(needs) }}
          # false only for a change to documentation alone: then, and only
          # then, a skipped job is not a failed one.
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "code changed: $CODE"
          bad="$(echo "$NEEDS" | jq -r --arg code "$CODE" '[to_entries[] | select(.value.result != "success" and ($code != "false" or .value.result != "skipped")) | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::not 'success': $bad -- failure, cancellation and skipping all mean the gate did not run to completion"
            exit 1
          fi
