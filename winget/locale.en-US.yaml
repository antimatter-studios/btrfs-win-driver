ShortDescription: Mount and read Btrfs volumes on Windows, in user mode, via WinFsp.
Description: |
  btrfs-win-driver mounts Btrfs volumes read-only as Windows drive
  letters through WinFsp. It runs in user mode: a fault takes down the
  mount, not Windows. Subvolumes and snapshots, compressed files (zlib,
  lzo, zstd) and every checksum type are read.

  Setup.exe chains the WinFsp redistributable so end users only run one
  installer. The installer also adds a "Mount as btrfs" right-click verb
  on .img files, and a CLI for browsing without mounting (info, ls, cat).
